apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fastapi-production-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fastapi-production-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              access.fastapi-production-api/ingress: "true"
      ports:
        - protocol: TCP
          port: http
