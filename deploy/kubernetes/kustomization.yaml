apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fastapi-production-api
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  - name: fastapi-production-api
    newName: ghcr.io/houngdev/fastapi-production-api
    newTag: replace-with-an-immutable-image-tag
