name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Quality, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fastapi_user
          POSTGRES_PASSWORD: fastapi_password
          POSTGRES_DB: fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastapi_user -d fastapi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://fastapi_user:fastapi_password@localhost:5432/fastapi_test
      BENCHMARK_DATABASE_URL: postgresql+psycopg://fastapi_user:fastapi_password@localhost:5432/fastapi_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      JWT_AUDIENCE: fastapi-client
      JWT_ISSUER: fastapi-production-api
      REDIS_TEST_URL: redis://localhost:6379/15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov-report=xml

      - name: Run database benchmark smoke test
        run: |
          uv run python -m benchmarks.db prepare --records 25
          uv run python -m benchmarks.db run \
            --mode both \
            --scenarios authenticated_read refresh_rotation \
            --iterations 8 \
            --warmup 2 \
            --concurrency 2 \
            --pool-size 2 \
            --output benchmark-smoke.json
          uv run python -m benchmarks.db verify-async-rollback

      - name: Clean up database benchmark fixtures
        if: always()
        run: uv run python -m benchmarks.db cleanup

      - name: Upload database benchmark smoke result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-benchmark-smoke
          path: benchmark-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Build distributions
        run: uv build

      - name: Smoke-test wheel
        run: >-
          uv run --isolated --no-project --with dist/*.whl python -c
          "import tomllib; from app.main import app;
          expected = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          assert app.version == expected, (app.version, expected)"

      - name: Build production container image
        run: docker build --tag fastapi-production-api:ci .

      - name: Verify production container identity and dependencies
        run: |
          test "$(docker run --rm --entrypoint id fastapi-production-api:ci -u)" = "10001"
          docker run --rm --entrypoint python fastapi-production-api:ci -c \
            "import importlib.util; assert importlib.util.find_spec('pytest') is None"

      - name: Smoke-test production container
        run: |
          docker run --detach \
            --name fastapi-production-api-ci \
            --network host \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env DATABASE_URL="$DATABASE_URL" \
            --env SECRET_KEY="$SECRET_KEY" \
            fastapi-production-api:ci

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live \
              && curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Show production container logs
        if: failure()
        run: docker logs fastapi-production-api-ci 2>/dev/null || true

      - name: Remove production container
        if: always()
        run: docker rm --force fastapi-production-api-ci 2>/dev/null || true
