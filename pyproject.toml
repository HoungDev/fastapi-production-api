[project]
name = "fastapi-production-api"
version = "1.2.0"
description = "A security-focused FastAPI backend foundation for production services."
readme = "README.md"
authors = [
    { name = "Nana Dev", email = "chukafe0401@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "api",
    "backend",
    "fastapi",
    "jwt",
    "postgresql",
    "python",
    "security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "alembic>=1.19.0",
    "bcrypt==4.3.0",
    "cryptography>=50.0.0,<51",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.3.4",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0,<3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=6.4.0,<7",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
    "uvicorn-worker>=0.4.0",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<0.66",
    "opentelemetry-instrumentation-httpx>=0.65b0,<0.66",
    "opentelemetry-instrumentation-redis>=0.65b0,<0.66",
]

[project.urls]
Homepage = "https://github.com/HoungDev/fastapi-production-api"
Repository = "https://github.com/HoungDev/fastapi-production-api"
Issues = "https://github.com/HoungDev/fastapi-production-api/issues"
Changelog = "https://github.com/HoungDev/fastapi-production-api/blob/main/CHANGELOG.md"

[project.scripts]
fastapi-production-api = "fastapi_production_api:main"
fastapi-production-worker = "app.workers.outbox:main"
fastapi-production-cache = "app.commands.oidc_cache:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app", "fastapi_production_api"]

[dependency-groups]
dev = [
    "asyncpg>=0.31.0,<1",
    "httpx2>=2.7.0",
    "pip-audit>=2.9.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --cov --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["app", "fastapi_production_api"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
